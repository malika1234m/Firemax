# FiremeX — fully local. Home Assistant is the whole application; FiremeX is a
# feature inside it.
#
# Cameras come from Home Assistant's own integrations (Hikvision, ONVIF,
# generic RTSP — whatever the user already set up). FiremeX reads those feeds
# through Home Assistant, runs the model on this machine, and publishes hazards
# back to Home Assistant. Nothing leaves the building and no account is needed.
#
# For the cloud-connected product — multi-site dashboards, incident history,
# authority escalation — see the "firemex" add-on beside this one.
name: FiremeX Fire & Smoke Detection (Local)
description: >-
  Detects fire and smoke in your existing Home Assistant cameras. Runs entirely
  on this machine — no account, no cloud, no internet needed after setup.
slug: firemex_local
version: "1.1.0"
url: https://github.com/malika1234m/Firemax/tree/main/addon/firemex-local

image: ghcr.io/malika1234m/firemex-ha

arch:
  - amd64
  - aarch64

init: true
boot: auto
startup: application

# Grants SUPERVISOR_TOKEN and access to Core at http://supervisor/core/api.
# This is the entire permission surface: FiremeX reads camera entities and
# writes a sensor/event back. It opens no ports and makes no other connection.
homeassistant_api: true

# Write access to Home Assistant's own config directory, used for exactly one
# thing: dropping the annotated alert snapshot into www/firemex/ so HA serves
# it at /local/firemex/. Without the evidence frame an operator is asked to
# declare an incident on a confidence number alone, which is not a reviewable
# decision.
map:
  - homeassistant_config:rw

# No host_network: FiremeX never touches the cameras directly, so it needs no
# route to the LAN. Home Assistant already holds those connections.

options:
  cameras: []
  confidence_threshold: 0.50
  alert_cooldown_seconds: 30
  detector_mode: yolo
  model_url: https://github.com/malika1234m/Firemax/releases/download/v0.1.0/fire_model.pt
  model_sha256: 2ab009042ba04827ee1cd1ccb0648832577677334c5fe4927e7c7950f7406c89
  process_fps: 2
  clear_after_seconds: 120
  hazard_classes:
    - fire
    - smoke
    - flame
  provision_dashboard: true

schema:
  # Empty list = watch every camera entity. Name entities to narrow it —
  # running the model on a doorbell costs CPU and false alarms, not safety.
  cameras:
    - str
  confidence_threshold: float(0.1,0.99)
  alert_cooldown_seconds: int(5,600)
  # mock runs everything except the model — use it to confirm the add-on can
  # see your cameras before committing a Pi to running inference.
  detector_mode: list(yolo|mock)
  model_url: "str?"
  # Verifies the download. Leave set: a swapped or corrupted model is a silent
  # detection failure, which here means a fire nobody is told about.
  model_sha256: "str?"
  # Home Assistant's MJPEG proxy re-encodes, and a Pi running HA has other work
  # to do. Fire does not appear and vanish in half a second.
  process_fps: float(0.2,10)
  clear_after_seconds: int(10,3600)
  # Which hazard classes raise an alert. Defaults to the learned classes only:
  # the colour and optical-flow branches misfire on Home Assistant's re-encoded
  # camera proxy, firing continuously on blue sky and compression noise. Add
  # gas_fire / lpg_fire / chemical_fire / gas_shimmer / person_down once you
  # have tested them against your own cameras.
  hazard_classes:
    - str
  # Creates the FiremeX dashboard, helpers and automations on start, so
  # installing the add-on is the whole setup. It rewrites the dashboard views
  # each start — turn it off once you have customised them.
  provision_dashboard: bool
