# Builds and publishes the FiremeX EZVIZ bridge add-on image.
#
# The bridge runs EZVIZ's own web player in headless Chromium, so it is a
# separate image from the detection add-on (firemex-ha). Tag ezviz-vX.Y.Z to
# publish version X.Y.Z, matching addon/firemex-ezviz-bridge/config.yaml.
#
# Published to: ghcr.io/<owner>/firemex-ezviz-bridge

name: Publish EZVIZ bridge add-on

on:
  push:
    tags: ["ezviz-v*"]
    branches: [main]
    paths:
      - "ezviz_bridge/**"
      - "addon/firemex-ezviz-bridge/**"
      - ".github/workflows/publish-ezviz-bridge.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/firemex-ezviz-bridge

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Home Assistant add-ons run on amd64 and aarch64 — matching the `arch`
      # list in addon/firemex-local/config.yaml. A Home Assistant Green or a
      # Raspberry Pi is aarch64; an Intel NUC or VM is amd64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The add-on's `version:` must match a published tag, so an ha-v1.0.0
          # tag produces the 1.0.0 image that config.yaml pulls.
          tags: |
            type=match,pattern=ezviz-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ezviz_bridge
          file: ezviz_bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
